# Pluto keyboard configuration
# Uncomment options as needed.

# Enable deep sleep for better battery life (peripheral/right half sleeps aggressively)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Set idle timeout (ms) before going to lower power state (default 30000 = 30s)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Bluetooth options
# CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
